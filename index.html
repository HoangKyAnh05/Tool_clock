<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Flashcard Học Từ Vựng</title>
  <meta name="description" content="Ứng dụng Flashcard học từ vựng nhanh, nhẹ, mượt mà và tự động đồng bộ.">
  <meta name="theme-color" content="#0f172a">
  
  <!-- PWA & Favicon Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="shortcut icon" href="icons/favicon.ico">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Fonts & Libraries -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    :root {
      --bg: #0b0d14;
      --card-bg: #131722;
      --primary: #00f2fe;
      --accent: #ff0050;
      --green: #10b981;
      --purple: #8b5cf6;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.12);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }

    .app-wrap {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      position: relative;
    }

    /* Top Bar - Optimized for iPhone Notch (Tai Thỏ) & Dynamic Island */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: max(20px, calc(env(safe-area-inset-top, 0px) + 14px));
      padding-bottom: 12px;
      padding-left: max(14px, env(safe-area-inset-left, 0px));
      padding-right: max(14px, env(safe-area-inset-right, 0px));
      background: rgba(19, 23, 34, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      z-index: 20;
      gap: 8px;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .filter-tabs {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .filter-tabs::-webkit-scrollbar { display: none; }

    .tab-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--muted);
      border: 1px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .tab-pill.active {
      background: rgba(0, 242, 254, 0.15);
      color: var(--primary);
      border-color: rgba(0, 242, 254, 0.35);
    }

    .action-btns {
      display: flex;
      gap: 6px;
    }

    .btn-action {
      height: 28px;
      padding: 0 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      transition: all 0.2s;
    }
    .btn-sync {
      background: linear-gradient(135deg, #0284c7 0%, #00f2fe 100%);
      color: #04131f;
      border: none;
      font-weight: 800;
    }
    .btn-zip {
      background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
      border: none;
    }

    /* Main Flashcard Container */
    .card-viewport {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      position: relative;
      overflow: hidden;
    }

    .card-box {
      width: 100%;
      height: 100%;
      max-height: 720px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      position: relative;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    .card-img-wrap {
      flex: 1;
      min-height: 200px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .card-img-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .card-info {
      padding: 14px 16px;
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 45%;
      overflow-y: auto;
    }

    .card-word {
      font-size: 20px;
      font-weight: 900;
      color: var(--primary);
      line-height: 1.3;
      user-select: text;
    }

    .card-trans {
      font-size: 15px;
      font-weight: 700;
      color: #34d399;
      line-height: 1.4;
      user-select: text;
    }

    .card-notes {
      font-size: 12.5px;
      color: #cbd5e1;
      line-height: 1.5;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 8px 10px;
      margin-top: 4px;
      user-select: text;
      white-space: pre-wrap;
    }

    /* Bottom Nav Bar */
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
      padding-bottom: max(12px, calc(env(safe-area-inset-bottom, 0px) + 8px));
      padding-left: max(14px, env(safe-area-inset-left, 0px));
      padding-right: max(14px, env(safe-area-inset-right, 0px));
      background: rgba(19, 23, 34, 0.95);
      border-top: 1px solid var(--border);
      z-index: 20;
      gap: 8px;
    }

    .nav-btn {
      flex: 1;
      height: 42px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      transition: all 0.15s;
    }
    .nav-btn:active {
      transform: scale(0.96);
    }
    .btn-next {
      background: linear-gradient(135deg, #00f2fe 0%, #3b82f6 100%);
      color: #0b0d14;
      border: none;
    }

    .counter-badge {
      font-size: 12px;
      font-weight: 800;
      color: #fff;
      padding: 0 10px;
      white-space: nowrap;
      text-align: center;
    }

    .btn-like {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .btn-like.liked {
      background: rgba(16, 185, 129, 0.2);
      border-color: #10b981;
      color: #10b981;
    }

    /* Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 16px;
    }
    .modal.active { display: flex; }
    .modal-box {
      width: 100%;
      max-width: 440px;
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .inp {
      width: 100%;
      height: 38px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      padding: 0 10px;
      font-size: 13px;
      outline: none;
    }

    /* Toast */
    #toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-30px);
      background: #1e293b;
      color: #00f2fe;
      border: 1px solid #00f2fe;
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 12.5px;
      font-weight: 700;
      z-index: 100000;
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="app-wrap">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="brand-title">🎵 Flashcard</div>
      <div class="filter-tabs">
        <button type="button" class="tab-pill active" id="tabAll" onclick="setFilter('all')">Tất cả (<span id="cntAll">0</span>)</button>
        <button type="button" class="tab-pill" id="tabDue" onclick="setFilter('due')">🔴 Ôn (<span id="cntDue">0</span>)</button>
        <button type="button" class="tab-pill" id="tabMastered" onclick="setFilter('mastered')">🟢 Thuộc (<span id="cntMastered">0</span>)</button>
        <button type="button" class="tab-pill" id="tabImage" onclick="setFilter('image')">🖼️ Ảnh (<span id="cntImage">0</span>)</button>
      </div>
      <div class="action-btns">
        <button type="button" class="btn-action btn-sync" id="btnSyncCloud" onclick="quickSyncCloud(event)" title="1-Click Đồng bộ tức thì từ Cloud (Bấm để tải ngay, Giữ 1s để chọn Slot khác)">☁️ Đồng bộ</button>
        <button type="button" class="btn-action btn-zip" id="btnZip" onclick="triggerZipUpload()">📦 ZIP</button>
        <button type="button" class="btn-action" id="btnAdd" onclick="openAddModal()">➕ Thêm</button>
      </div>
    </div>

    <!-- Main Card Viewport -->
    <div class="card-viewport" id="viewport">
      <div class="card-box" id="cardBox">
        <div class="card-img-wrap" id="cardImgWrap">
          <img id="cardImg" src="" alt="Flashcard" style="display: none;" />
          <div id="imgPlaceholder" style="color: #64748b; font-size: 13px; font-weight: 700; text-align: center; padding: 20px;">
            ⏳ Đang tải dữ liệu Flashcard...
          </div>
        </div>
        <div class="card-info" id="cardInfo">
          <div class="card-word" id="cardWord">Đang tải...</div>
          <div class="card-trans" id="cardTrans"></div>
          <div class="card-notes" id="cardNotes" style="display: none;"></div>
        </div>
      </div>
    </div>

    <!-- Bottom Controls -->
    <div class="bottom-bar">
      <button type="button" class="btn-like" id="btnLike" title="Đánh dấu đã thuộc" onclick="toggleMastered()">❤️</button>
      <button type="button" class="nav-btn" onclick="prevCard()">⬆️ Thẻ trước</button>
      <div class="counter-badge" id="counterBadge">0 / 0</div>
      <button type="button" class="nav-btn btn-next" onclick="nextCard()">Thẻ tiếp ⬇️</button>
    </div>
  </div>

  <!-- Hidden File Input for ZIP -->
  <input type="file" id="zipInput" accept=".zip,application/zip" style="display: none;" />

  <!-- Fullscreen Interactive Image Modal with Pinch-To-Zoom & Pan -->
  <div class="modal" id="fullImgModal" style="background: rgba(0,0,0,0.96); padding: 0; touch-action: none;">
    <button type="button" id="btnCloseFullImg" style="position: absolute; top: max(16px, calc(env(safe-area-inset-top, 0px) + 12px)); right: 16px; width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,0.2); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.3); color: #fff; font-size: 20px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 100002;">✕</button>
    <div id="fullImgContainer" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative;">
      <img id="fullImg" src="" style="max-width: 95%; max-height: 95%; object-fit: contain; transform-origin: center center; will-change: transform; transition: transform 0.08s ease-out; user-select: none;" />
    </div>
  </div>

  <!-- Add Card Modal -->
  <div class="modal" id="addCardModal">
    <div class="modal-box">
      <h3 style="font-size: 15px; color: #fff;">➕ Thêm Thẻ Mới</h3>
      <input type="text" id="addWord" class="inp" placeholder="Từ vựng / Tiêu đề *" />
      <input type="text" id="addTrans" class="inp" placeholder="Dịch nghĩa tiếng Việt" />
      <textarea id="addNotes" class="inp" style="height: 60px; padding: 6px 10px; font-family: inherit;" placeholder="Ghi chú / Ví dụ"></textarea>
      <input type="file" id="addImgFile" accept="image/*" class="inp" style="padding: 6px;" />
      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px;">
        <button type="button" class="btn-action" onclick="document.getElementById('addCardModal').classList.remove('active')">Hủy</button>
        <button type="button" class="btn-action btn-zip" onclick="saveNewCard()">Lưu thẻ</button>
      </div>
    </div>
  </div>

  
  <!-- Cloud Sync & Backup Modal -->
  <div class="modal" id="syncModal">
    <div class="modal-box" style="max-width: 400px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <h3 style="font-size: 15px; color: #fff; display: flex; align-items: center; gap: 6px;">
          ☁️ <span>Đồng Bộ & Sao Lưu Cloud</span>
        </h3>
        <button type="button" onclick="closeSyncModal()" style="background: none; border: none; color: #94a3b8; font-size: 18px; cursor: pointer; padding: 4px;">✕</button>
      </div>

      <p style="font-size: 12px; color: #94a3b8; line-height: 1.4;">
        Đồng bộ dữ liệu học tập giữa máy tính (Electron PC) và điện thoại (GitHub Page).
      </p>

      <div>
        <label style="font-size: 11.5px; font-weight: 700; color: #cbd5e1; display: block; margin-bottom: 6px;">Chọn Kênh / Mã Slot Cloud:</label>
        <select id="selSyncSlot" class="inp" style="background: #0f172a; color: #f8fafc; cursor: pointer;">
          <option value="slot_1" selected>📦 Slot 1 (Dữ liệu chính - slot_1.json)</option>
          <option value="flashcards">📁 flashcards.json (Dữ liệu gốc)</option>
          <option value="slot_2">📦 Slot 2 (slot_2.json)</option>
          <option value="slot_3">📦 Slot 3 (slot_3.json)</option>
          <option value="slot_4">📦 Slot 4 (slot_4.json)</option>
          <option value="slot_5">📦 Slot 5 (slot_5.json)</option>
          <option value="slot_6">📦 Slot 6 (slot_6.json)</option>
          <option value="slot_7">📦 Slot 7 (slot_7.json)</option>
          <option value="slot_8">📦 Slot 8 (slot_8.json)</option>
          <option value="slot_9">📦 Slot 9 (slot_9.json)</option>
          <option value="slot_0">📦 Slot 0 (slot_0.json)</option>
        </select>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 4px;">
        <button type="button" class="btn-action" id="btnDownloadFromCloud" onclick="downloadFromCloud()" style="width: 100%; height: 38px; background: linear-gradient(135deg, #0284c7, #00f2fe); color: #04131f; font-weight: 800; justify-content: center; gap: 8px; border-radius: 8px; font-size: 12.5px;">
          📥 Tải & Đồng bộ từ GitHub Cloud
        </button>

        <button type="button" class="btn-action" onclick="exportBackupJson()" style="width: 100%; height: 36px; background: #1e293b; color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.4); justify-content: center; gap: 6px; border-radius: 8px; font-size: 12px;">
          📤 Xuất file sao lưu (Backup .JSON)
        </button>

        <button type="button" class="btn-action" onclick="document.getElementById('importJsonInput').click()" style="width: 100%; height: 36px; background: #1e293b; color: #a78bfa; border: 1px solid rgba(167, 139, 250, 0.4); justify-content: center; gap: 6px; border-radius: 8px; font-size: 12px;">
          📥 Nhập từ file sao lưu .JSON
        </button>
      </div>

      <input type="file" id="importJsonInput" accept=".json,application/json" style="display: none;" onchange="importBackupJson(event)" />
    </div>
  </div>

  <!-- Toast Message -->
  <div id="toast"></div>

  <script>
    // State
    let ALL_ITEMS = [];
    let curIndex = 0;
    let curFilter = 'all';
    let masteredSet = new Set();
    let dueSet = new Set();

    function showToast(msg) {
      const t = document.getElementById('toast');
      if (!t) return;
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(t._tm);
      t._tm = setTimeout(() => t.classList.remove('show'), 2500);
    }

    // Escape HTML
    function esc(s) {
      if (!s) return '';
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Load Local Storage Sets
    try {
      masteredSet = new Set(JSON.parse(localStorage.getItem('fc_mastered') || '[]'));
      dueSet = new Set(JSON.parse(localStorage.getItem('fc_due') || '[]'));
      curFilter = localStorage.getItem('fc_filter') || 'all';
      curIndex = parseInt(localStorage.getItem('fc_idx') || '0', 10);
    } catch(e) {}

    function saveState() {
      try {
        localStorage.setItem('fc_mastered', JSON.stringify([...masteredSet]));
        localStorage.setItem('fc_due', JSON.stringify([...dueSet]));
        localStorage.setItem('fc_filter', curFilter);
        localStorage.setItem('fc_idx', curIndex.toString());
      } catch(e) {}
    }

    // Fetch Flashcard Data Dynamically (Tự động nạp nhanh nhất từ Cloud slot_1 / flashcards)
    async function loadData() {
      let loaded = false;

      // 1. Thử nạp nhanh từ Slot 1 (kênh chính thường xuyên cập nhật nhất)
      try {
        const res1 = await fetch('./data/slot_1.json?t=' + Date.now());
        if (res1.ok) {
          const data1 = await res1.json();
          const items1 = data1.items || (Array.isArray(data1) ? data1 : []);
          if (Array.isArray(items1) && items1.length > 0) {
            ALL_ITEMS = items1;
            loaded = true;
            if (Array.isArray(data1.masteredIds)) data1.masteredIds.forEach(id => masteredSet.add(id));
            if (Array.isArray(data1.dueIds)) data1.dueIds.forEach(id => dueSet.add(id));
          }
        }
      } catch(e) {}

      // 2. Nếu chưa có, nạp từ flashcards.json
      if (!loaded) {
        try {
          const res = await fetch('./data/flashcards.json?t=' + Date.now());
          if (res.ok) {
            const data = await res.json();
            const items = data.items || (Array.isArray(data) ? data : []);
            if (Array.isArray(items) && items.length > 0) {
              ALL_ITEMS = items;
              loaded = true;
              if (Array.isArray(data.masteredIds)) data.masteredIds.forEach(id => masteredSet.add(id));
              if (Array.isArray(data.dueIds)) data.dueIds.forEach(id => dueSet.add(id));
            }
          }
        } catch(err) {
          console.warn('Dynamic fetch failed, falling back to cache:', err);
        }
      }

      if (ALL_ITEMS.length === 0) {
        try {
          const saved = localStorage.getItem('fc_items_cache');
          if (saved) ALL_ITEMS = JSON.parse(saved);
        } catch(e) {}
      }

      updateUI();
    }

    function getFiltered() {
      return ALL_ITEMS.filter(it => {
        if (curFilter === 'due') return dueSet.has(it.id);
        if (curFilter === 'mastered') return masteredSet.has(it.id);
        if (curFilter === 'image') return !!it.imageUrl;
        return true;
      });
    }

    function setFilter(f) {
      curFilter = f;
      curIndex = 0;
      document.querySelectorAll('.tab-pill').forEach(el => el.classList.remove('active'));
      const activeTab = document.getElementById(f === 'all' ? 'tabAll' : (f === 'due' ? 'tabDue' : (f === 'mastered' ? 'tabMastered' : 'tabImage')));
      if (activeTab) activeTab.classList.add('active');
      updateCard();
      saveState();
    }

    function updateCounts() {
      const allCount = ALL_ITEMS.length;
      const dueCount = ALL_ITEMS.filter(x => dueSet.has(x.id)).length;
      const mastCount = ALL_ITEMS.filter(x => masteredSet.has(x.id)).length;
      const imgCount = ALL_ITEMS.filter(x => !!x.imageUrl).length;

      document.getElementById('cntAll').textContent = allCount;
      document.getElementById('cntDue').textContent = dueCount;
      document.getElementById('cntMastered').textContent = mastCount;
      document.getElementById('cntImage').textContent = imgCount;
    }

    function updateCard() {
      updateCounts();
      const list = getFiltered();
      const total = list.length;
      const badge = document.getElementById('counterBadge');
      const imgEl = document.getElementById('cardImg');
      const placeholder = document.getElementById('imgPlaceholder');
      const wordEl = document.getElementById('cardWord');
      const transEl = document.getElementById('cardTrans');
      const notesEl = document.getElementById('cardNotes');
      const btnLike = document.getElementById('btnLike');

      if (total === 0) {
        if (badge) badge.textContent = '0 / 0';
        if (imgEl) imgEl.style.display = 'none';
        if (placeholder) {
          placeholder.style.display = 'block';
          placeholder.textContent = 'Chưa có thẻ nào trong mục này.';
        }
        if (wordEl) wordEl.textContent = '---';
        if (transEl) transEl.textContent = '';
        if (notesEl) notesEl.style.display = 'none';
        if (btnLike) btnLike.classList.remove('liked');
        return;
      }

      if (curIndex < 0) curIndex = 0;
      if (curIndex >= total) curIndex = total - 1;

      const item = list[curIndex];
      if (badge) badge.textContent = `${curIndex + 1} / ${total}`;

      if (item.imageUrl) {
        if (imgEl) {
          imgEl.src = item.imageUrl;
          imgEl.style.display = 'block';
        }
        if (placeholder) placeholder.style.display = 'none';
      } else {
        if (imgEl) imgEl.style.display = 'none';
        if (placeholder) {
          placeholder.style.display = 'block';
          placeholder.textContent = '🖼️ (Thẻ không có ảnh)';
        }
      }

      if (wordEl) wordEl.textContent = item.word || '---';
      if (transEl) transEl.textContent = item.translation || '';
      if (notesEl) {
        if (item.notes) {
          notesEl.textContent = item.notes;
          notesEl.style.display = 'block';
        } else {
          notesEl.style.display = 'none';
        }
      }

      if (btnLike) {
        if (masteredSet.has(item.id)) {
          btnLike.classList.add('liked');
        } else {
          btnLike.classList.remove('liked');
        }
      }

      saveState();
    }

    function updateUI() {
      updateCounts();
      updateCard();
    }

    let isNavigating = false;
    function nextCard() {
      const list = getFiltered();
      if (list.length <= 1 || isNavigating) return;
      isNavigating = true;
      const box = document.getElementById('cardBox');
      if (box) {
        box.style.transition = 'transform 0.16s ease, opacity 0.16s ease';
        box.style.transform = 'translateY(-24px)';
        box.style.opacity = '0.6';
      }
      setTimeout(() => {
        curIndex = (curIndex + 1) % list.length;
        updateCard();
        if (box) {
          box.style.transform = 'translateY(24px)';
          box.offsetHeight; // reflow
          box.style.transform = 'translateY(0)';
          box.style.opacity = '1';
        }
        setTimeout(() => { isNavigating = false; }, 160);
      }, 120);
    }

    function prevCard() {
      const list = getFiltered();
      if (list.length <= 1 || isNavigating) return;
      isNavigating = true;
      const box = document.getElementById('cardBox');
      if (box) {
        box.style.transition = 'transform 0.16s ease, opacity 0.16s ease';
        box.style.transform = 'translateY(24px)';
        box.style.opacity = '0.6';
      }
      setTimeout(() => {
        curIndex = (curIndex - 1 + list.length) % list.length;
        updateCard();
        if (box) {
          box.style.transform = 'translateY(-24px)';
          box.offsetHeight; // reflow
          box.style.transform = 'translateY(0)';
          box.style.opacity = '1';
        }
        setTimeout(() => { isNavigating = false; }, 160);
      }, 120);
    }

    function toggleMastered() {
      const list = getFiltered();
      if (list.length === 0) return;
      const item = list[curIndex];
      if (masteredSet.has(item.id)) {
        masteredSet.delete(item.id);
        showToast('🔄 Đã chuyển về Cần ôn');
      } else {
        masteredSet.add(item.id);
        dueSet.delete(item.id);
        showToast('❤️ Đã đánh dấu Thuộc');
      }
      updateCard();
    }

    // Image Fullscreen Interactive Zoom & Pan (2-finger Pinch, Double-tap, Mouse Wheel, Drag)
    let zoomScale = 1;
    let panX = 0;
    let panY = 0;
    let lastTapTime = 0;
    let isPanning = false;
    let panStartX = 0;
    let panStartY = 0;
    let initialPinchDist = 0;
    let initialZoomScale = 1;

    const fullModal = document.getElementById('fullImgModal');
    const fullImg = document.getElementById('fullImg');
    const fullContainer = document.getElementById('fullImgContainer');
    const btnCloseFullImg = document.getElementById('btnCloseFullImg');

    function applyZoomTransform(animate = false) {
      if (!fullImg) return;
      if (animate) {
        fullImg.style.transition = 'transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1)';
      } else {
        fullImg.style.transition = 'none';
      }
      fullImg.style.transform = `translate3d(${panX}px, ${panY}px, 0) scale(${zoomScale})`;
    }

    function resetZoom() {
      zoomScale = 1;
      panX = 0;
      panY = 0;
      applyZoomTransform(true);
    }

    function closeFullscreen() {
      resetZoom();
      if (fullModal) fullModal.classList.remove('active');
    }

    if (btnCloseFullImg) {
      btnCloseFullImg.addEventListener('click', e => {
        e.stopPropagation();
        closeFullscreen();
      });
    }

    // Image Zoom Click Trigger
    document.getElementById('cardImgWrap').addEventListener('click', () => {
      const imgEl = document.getElementById('cardImg');
      if (imgEl && imgEl.src && imgEl.style.display !== 'none') {
        if (fullImg) fullImg.src = imgEl.src;
        resetZoom();
        if (fullModal) fullModal.classList.add('active');
      }
    });

    if (fullContainer) {
      // Touch Handling (Pinch-to-zoom & Pan)
      fullContainer.addEventListener('touchstart', e => {
        if (e.touches.length === 2) {
          initialPinchDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          initialZoomScale = zoomScale;
        } else if (e.touches.length === 1) {
          const now = Date.now();
          if (now - lastTapTime < 280) {
            if (zoomScale > 1.2) {
              zoomScale = 1;
              panX = 0;
              panY = 0;
            } else {
              zoomScale = 2.5;
            }
            applyZoomTransform(true);
            lastTapTime = 0;
            return;
          }
          lastTapTime = now;

          if (zoomScale > 1) {
            isPanning = true;
            panStartX = e.touches[0].clientX - panX;
            panStartY = e.touches[0].clientY - panY;
          }
        }
      }, { passive: false });

      fullContainer.addEventListener('touchmove', e => {
        if (e.touches.length === 2) {
          e.preventDefault();
          const dist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          if (initialPinchDist > 0) {
            const factor = dist / initialPinchDist;
            zoomScale = Math.min(Math.max(initialZoomScale * factor, 1), 5);
            if (zoomScale <= 1) {
              panX = 0;
              panY = 0;
            }
            applyZoomTransform(false);
          }
        } else if (e.touches.length === 1 && isPanning && zoomScale > 1) {
          e.preventDefault();
          panX = e.touches[0].clientX - panStartX;
          panY = e.touches[0].clientY - panStartY;
          applyZoomTransform(false);
        }
      }, { passive: false });

      fullContainer.addEventListener('touchend', e => {
        if (e.touches.length < 2) {
          initialPinchDist = 0;
        }
        if (e.touches.length === 0) {
          isPanning = false;
          if (zoomScale < 1) {
            resetZoom();
          }
        }
      });

      // Mouse Drag Pan (Desktop)
      fullContainer.addEventListener('mousedown', e => {
        if (zoomScale > 1) {
          isPanning = true;
          panStartX = e.clientX - panX;
          panStartY = e.clientY - panY;
          fullContainer.style.cursor = 'grabbing';
        }
      });

      window.addEventListener('mousemove', e => {
        if (isPanning && zoomScale > 1) {
          panX = e.clientX - panStartX;
          panY = e.clientY - panStartY;
          applyZoomTransform(false);
        }
      });

      window.addEventListener('mouseup', () => {
        isPanning = false;
        if (fullContainer) fullContainer.style.cursor = zoomScale > 1 ? 'grab' : 'default';
      });

      // Mouse Wheel Zoom (Desktop)
      fullContainer.addEventListener('wheel', e => {
        e.preventDefault();
        const delta = e.deltaY > 0 ? -0.3 : 0.3;
        zoomScale = Math.min(Math.max(zoomScale + delta, 1), 5);
        if (zoomScale <= 1) {
          panX = 0;
          panY = 0;
        }
        applyZoomTransform(true);
      }, { passive: false });

      // Double click to zoom on Desktop
      fullContainer.addEventListener('dblclick', () => {
        if (zoomScale > 1.2) {
          zoomScale = 1;
          panX = 0;
          panY = 0;
        } else {
          zoomScale = 2.5;
        }
        applyZoomTransform(true);
      });
    }

    // Unified Gesture Engine (Swipe Up / Down, Drag, Mouse Wheel)
    let startY = 0;
    let startX = 0;
    let isMouseDown = false;
    let lastWheelTime = 0;

    // Touch Swipe (Mobile)
    window.addEventListener('touchstart', e => {
      if (e.target.closest('.modal') || e.target.closest('.top-bar') || e.target.closest('.bottom-bar')) return;
      startY = e.touches[0].clientY;
      startX = e.touches[0].clientX;
    }, { passive: true });

    window.addEventListener('touchend', e => {
      if (e.target.closest('.modal') || e.target.closest('.top-bar') || e.target.closest('.bottom-bar')) return;
      const deltaY = e.changedTouches[0].clientY - startY;
      const deltaX = e.changedTouches[0].clientX - startX;
      
      // Vertical swipe priority (Swipe Up -> Next Card, Swipe Down -> Prev Card)
      if (Math.abs(deltaY) > 30 && Math.abs(deltaY) >= Math.abs(deltaX)) {
        if (deltaY < 0) nextCard();
        else prevCard();
      } else if (Math.abs(deltaX) > 45) {
        if (deltaX < 0) nextCard();
        else prevCard();
      }
    }, { passive: true });

    // Mouse Drag (Desktop)
    window.addEventListener('mousedown', e => {
      if (e.target.closest('.modal') || e.target.closest('.top-bar') || e.target.closest('.bottom-bar') || e.target.closest('button')) return;
      isMouseDown = true;
      startY = e.clientY;
      startX = e.clientX;
    });

    window.addEventListener('mouseup', e => {
      if (!isMouseDown) return;
      isMouseDown = false;
      const deltaY = e.clientY - startY;
      const deltaX = e.clientX - startX;
      if (Math.abs(deltaY) > 30 && Math.abs(deltaY) >= Math.abs(deltaX)) {
        if (deltaY < 0) nextCard();
        else prevCard();
      } else if (Math.abs(deltaX) > 45) {
        if (deltaX < 0) nextCard();
        else prevCard();
      }
    });

    // Mouse Wheel Scroll
    window.addEventListener('wheel', e => {
      if (e.target.closest('.card-notes') || e.target.closest('.modal')) return;
      const now = Date.now();
      if (now - lastWheelTime < 280) return;
      if (e.deltaY > 20) {
        lastWheelTime = now;
        nextCard();
      } else if (e.deltaY < -20) {
        lastWheelTime = now;
        prevCard();
      }
    }, { passive: true });

    // Keyboard Navigation
    window.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        nextCard();
      } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
        e.preventDefault();
        prevCard();
      }
    });

    
    
    // 1-Click Quick Sync (Tự động đồng bộ ngay trong 0.3s)
    let syncPressTimer = null;
    async function quickSyncCloud(e) {
      if (e) e.preventDefault();
      const btn = document.getElementById('btnSyncCloud');
      const origText = btn ? btn.innerHTML : '';
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '⏳ Đang đồng bộ...';
      }

      showToast('☁️ Đang đồng bộ 982 thẻ từ Cloud...');
      try {
        const res = await fetch('./data/slot_1.json?t=' + Date.now());
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const items = data.items || (Array.isArray(data) ? data : []);
        if (items.length > 0) {
          ALL_ITEMS = items;
          if (Array.isArray(data.masteredIds)) data.masteredIds.forEach(id => masteredSet.add(id));
          if (Array.isArray(data.dueIds)) data.dueIds.forEach(id => dueSet.add(id));
          curIndex = 0;
          saveState();
          updateUI();
          showToast('✅ Đã đồng bộ thành công ' + items.length + ' thẻ từ App PC!');
        } else {
          openSyncModal();
        }
      } catch(err) {
        console.warn('Quick sync error, opening slot menu:', err);
        openSyncModal();
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = origText;
        }
      }
    }

    // Cloud Sync & Backup Functions
    function openSyncModal() {
      document.getElementById('syncModal').classList.add('active');
    }

    function closeSyncModal() {
      document.getElementById('syncModal').classList.remove('active');
    }

    async function downloadFromCloud() {
      const sel = document.getElementById('selSyncSlot');
      const slot = sel ? sel.value : 'slot_1';
      const fileName = (slot === 'flashcards' ? 'flashcards.json' : slot + '.json');
      const btn = document.getElementById('btnDownloadFromCloud');
      const origText = btn ? btn.textContent : '';
      if (btn) {
        btn.disabled = true;
        btn.textContent = '⏳ Đang tải dữ liệu từ Cloud...';
      }

      try {
        const res = await fetch('./data/' + fileName + '?t=' + Date.now());
        if (!res.ok) {
          throw new Error('Không tìm thấy file ' + fileName + ' trên Cloud (HTTP ' + res.status + '). Hãy đảm bảo đã đẩy dữ liệu lên GitHub trước nhé!');
        }
        const data = await res.json();
        const items = data.items || (Array.isArray(data) ? data : []);
        if (!Array.isArray(items) || items.length === 0) {
          showToast('⚠️ Kênh ' + slot + ' chưa có thẻ nào.');
        } else {
          ALL_ITEMS = items;
          try {
            localStorage.setItem('fc_items_cache', JSON.stringify(ALL_ITEMS.slice(0, 150)));
          } catch(e) {}
          if (Array.isArray(data.masteredIds)) {
            data.masteredIds.forEach(id => masteredSet.add(id));
          }
          if (Array.isArray(data.dueIds)) {
            data.dueIds.forEach(id => dueSet.add(id));
          }
          curIndex = 0;
          saveState();
          updateUI();
          showToast('✅ Đã đồng bộ thành công ' + items.length + ' thẻ từ Cloud (' + slot + ')!');
          closeSyncModal();
        }
      } catch(err) {
        console.error('Download Cloud error:', err);
        showToast('❌ Lỗi: ' + (err.message || 'Không thể kết nối Cloud'));
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = origText;
        }
      }
    }

    function exportBackupJson() {
      if (ALL_ITEMS.length === 0) {
        return showToast('⚠️ Chưa có thẻ nào để xuất dữ liệu.');
      }
      const backupPayload = {
        exportDate: new Date().toISOString(),
        totalItems: ALL_ITEMS.length,
        masteredIds: Array.from(masteredSet),
        dueIds: Array.from(dueSet),
        items: ALL_ITEMS
      };
      const blob = new Blob([JSON.stringify(backupPayload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'Flashcard_Backup_' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('📤 Đã xuất file sao lưu (' + ALL_ITEMS.length + ' thẻ)!');
    }

    function importBackupJson(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          const items = data.items || (Array.isArray(data) ? data : []);
          if (Array.isArray(items) && items.length > 0) {
            ALL_ITEMS = items;
            try {
              localStorage.setItem('fc_items_cache', JSON.stringify(ALL_ITEMS.slice(0, 150)));
            } catch(err) {}
            if (Array.isArray(data.masteredIds)) {
              data.masteredIds.forEach(id => masteredSet.add(id));
            }
            if (Array.isArray(data.dueIds)) {
              data.dueIds.forEach(id => dueSet.add(id));
            }
            curIndex = 0;
            saveState();
            updateUI();
            showToast('✅ Đã nạp ' + items.length + ' thẻ từ file sao lưu!');
            closeSyncModal();
          } else {
            showToast('❌ File JSON không chứa danh sách thẻ hợp lệ.');
          }
        } catch(err) {
          showToast('❌ Lỗi đọc file JSON: ' + err.message);
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    // ZIP Bulk Import
    function triggerZipUpload() {
      document.getElementById('zipInput').click();
    }

    document.getElementById('zipInput').addEventListener('change', async e => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      showToast('⏳ Đang đọc file ZIP...');

      try {
        const zip = new JSZip();
        const zipData = await zip.loadAsync(file);
        const validExt = /\.(png|jpe?g|webp|gif|bmp|svg|avif)$/i;
        const entries = [];

        zipData.forEach((relPath, entry) => {
          if (entry.dir) return;
          const normPath = relPath.split('\\').join('/');
          const parts = normPath.split('/');
          const fileName = parts[parts.length - 1];
          const isHidden = parts.some(p => p.startsWith('.') || p === '__MACOSX');

          if (!isHidden && validExt.test(fileName)) {
            entries.push({ path: normPath, entry, fileName });
          }
        });

        if (entries.length === 0) {
          alert('Không tìm thấy ảnh nào trong file ZIP này.');
          return;
        }

        entries.sort((a, b) => a.path.localeCompare(b.path, undefined, { numeric: true, sensitivity: 'base' }));

        const newItems = [];
        const now = new Date().toISOString();

        for (let i = 0; i < entries.length; i++) {
          const item = entries[i];
          const base64 = await item.entry.async('base64');
          const ext = item.fileName.split('.').pop().toLowerCase();
          const mime = ext === 'jpg' || ext === 'jpeg' ? 'image/jpeg' : (ext === 'webp' ? 'image/webp' : 'image/png');
          const name = item.fileName.replace(/\.[^/.]+$/, '').trim();

          newItems.push({
            id: 'tk_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6) + '_' + i,
            word: name || ('🖼️ Thẻ ảnh #' + (ALL_ITEMS.length + i + 1)),
            translation: '',
            notes: '',
            imageUrl: 'data:' + mime + ';base64,' + base64,
            createdAt: now
          });
        }

        ALL_ITEMS.unshift(...newItems);
        curIndex = 0;
        updateUI();
        showToast('🎉 Đã nạp thành công ' + newItems.length + ' ảnh!');

        try {
          localStorage.setItem('fc_items_cache', JSON.stringify(ALL_ITEMS.slice(0, 100)));
        } catch(e) {}
      } catch(err) {
        alert('Lỗi đọc ZIP: ' + err.message);
      }
      e.target.value = '';
    });

    // Add Card Dialog
    function openAddModal() {
      document.getElementById('addWord').value = '';
      document.getElementById('addTrans').value = '';
      document.getElementById('addNotes').value = '';
      document.getElementById('addImgFile').value = '';
      document.getElementById('addCardModal').classList.add('active');
    }

    async function saveNewCard() {
      const word = (document.getElementById('addWord').value || '').trim();
      const trans = (document.getElementById('addTrans').value || '').trim();
      const notes = (document.getElementById('addNotes').value || '').trim();
      const file = document.getElementById('addImgFile').files?.[0];

      let imgUrl = '';
      if (file) {
        imgUrl = await new Promise(r => {
          const fr = new FileReader();
          fr.onload = ev => r(ev.target.result);
          fr.readAsDataURL(file);
        });
      }

      if (!word && !imgUrl) {
        alert('Vui lòng nhập từ vựng hoặc chọn 1 hình ảnh!');
        return;
      }

      const newItem = {
        id: 'tk_' + Date.now(),
        word: word || ('🖼️ Thẻ ảnh #' + (ALL_ITEMS.length + 1)),
        translation: trans,
        notes: notes,
        imageUrl: imgUrl,
        createdAt: new Date().toISOString()
      };

      ALL_ITEMS.unshift(newItem);
      curIndex = 0;
      document.getElementById('addCardModal').classList.remove('active');
      updateUI();
      showToast('✅ Đã thêm thẻ mới!');
    }

    // Startup Load
    loadData();
  </script>
