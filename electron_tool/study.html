<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Màn Hình Học Tập Riêng</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      margin: 0;
      padding: 0;
    }
    
    .study-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      scrollbar-width: thin;
      scrollbar-color: var(--purple) transparent;
    }
    
    .study-container::-webkit-scrollbar {
      width: 6px;
    }
    
    .study-container::-webkit-scrollbar-track {
      background: transparent;
    }
    
    .study-container::-webkit-scrollbar-thumb {
      background: var(--purple);
      border-radius: 99px;
    }
    
    .study-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      margin-bottom: 20px;
    }
    
    .study-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 0 4px;
    }
    
    .font-size-controls {
      display: flex;
      gap: 8px;
    }
    
    .font-btn {
      background: rgba(255, 255, 255, 0.07);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
      transition: background var(--transition), transform var(--transition);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    .font-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-1px);
    }
    
    .font-btn:active {
      transform: translateY(0);
    }

    .font-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
      background: rgba(255, 255, 255, 0.05) !important;
      border-color: rgba(255, 255, 255, 0.05) !important;
      color: var(--muted) !important;
    }
    
    .detail-section {
      margin-bottom: 24px;
      background: rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.03);
      border-radius: 10px;
      padding: 16px 20px;
      transition: all var(--transition);
      cursor: pointer;
    }
    
    .detail-section:hover {
      border-color: rgba(139, 92, 246, 0.3);
      background: rgba(255, 255, 255, 0.02);
    }

    .reading-active {
      border-color: var(--purple2) !important;
      box-shadow: 0 0 14px rgba(139, 92, 246, 0.35);
      background: rgba(139, 92, 246, 0.08) !important;
      transform: scale(1.005);
      transition: all 0.3s ease;
    }
    
    .detail-section-lbl {
      font-size: 13px;
      font-weight: 700;
      color: var(--purple2);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .detail-section-val {
      font-size: 15px;
      line-height: 1.6;
      color: var(--text);
      white-space: pre-wrap;
      user-select: text;
    }
    
    .detail-image-box {
      margin-bottom: 24px;
      text-align: center;
      background: rgba(0,0,0,0.2);
      border-radius: var(--radius);
      padding: 16px;
      border: 1px dashed var(--border);
    }
    
    .detail-image-box img {
      max-width: 100%;
      max-height: 400px;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      transition: transform 0.3s ease;
      cursor: zoom-in;
    }
    
    /* Floating scroll buttons */
    .scroll-btn-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 9999;
    }
    
    .scroll-arrow-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(139, 92, 246, 0.25);
      border: 1px solid rgba(139, 92, 246, 0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
    }
    
    .scroll-arrow-btn:hover {
      background: rgba(139, 92, 246, 0.45);
      border-color: rgba(139, 92, 246, 0.6);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.45);
    }
    
    .scroll-arrow-btn:active {
      transform: translateY(0);
    }
    
    .scroll-arrow-btn.view-img-btn {
      background: rgba(236, 72, 153, 0.25);
      border: 1px solid rgba(236, 72, 153, 0.4);
    }
    
    .scroll-arrow-btn.view-img-btn:hover {
      background: rgba(236, 72, 153, 0.45);
      border-color: rgba(236, 72, 153, 0.6);
      box-shadow: 0 6px 20px rgba(236, 72, 153, 0.45);
    }
    
    /* Style for Image Modal Lightbox */
    .image-modal {
      display: none;
      position: fixed;
      z-index: 10000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(15, 15, 26, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .image-modal-content-container {
      max-width: 90%;
      max-height: 85%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #imageModalContent img {
      max-width: 100%;
      max-height: 80vh;
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      object-fit: contain;
      transform: scale(0.95);
      animation: zoomIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes zoomIn {
      to { transform: scale(1); }
    }

    .image-modal-close {
      position: absolute;
      top: 20px;
      right: 30px;
      color: #fff;
      font-size: 40px;
      font-weight: bold;
      transition: color 0.2s;
      cursor: pointer;
      user-select: none;
      z-index: 10002;
    }

    .image-modal-close:hover {
      color: #ef4444;
    }

    /* Navigation arrows */
    .image-modal-prev, .image-modal-next {
      cursor: pointer;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: auto;
      padding: 16px;
      color: white;
      font-weight: bold;
      font-size: 24px;
      transition: all 0.2s ease;
      user-select: none;
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.05);
      z-index: 10001;
      border-radius: 8px;
    }

    .image-modal-next {
      right: 16px;
    }

    .image-modal-prev {
      left: 16px;
    }

    .image-modal-prev:hover, .image-modal-next:hover {
      background-color: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.2);
      color: var(--purple2);
    }
  </style>
</head>
<body>
  <!-- Custom titlebar for frameless window -->
  <div class="titlebar" id="titlebar">
    <span class="titlebar-icon">📖</span>
    <span class="titlebar-title" id="winTitle">Màn hình học tập riêng</span>
    <div class="titlebar-controls">
      <button class="ctrl-btn minimize" id="btnMinimize" title="Thu nhỏ">─</button>
      <button class="ctrl-btn maximize" id="btnMaximize" title="Phóng to">▢</button>
      <button class="ctrl-btn close" id="btnClose" title="Đóng">✕</button>
    </div>
  </div>

  <div class="study-container">
    <div class="study-controls">
      <div class="font-size-controls">
        <button class="font-btn" id="btnFontDec">🔍 A-</button>
        <button class="font-btn" id="btnFontNormal">Cỡ chữ gốc</button>
        <button class="font-btn" id="btnFontInc">🔍 A+</button>
        <button class="font-btn" id="btnBilingualTranslate" style="background: rgba(236, 72, 153, 0.15); border-color: rgba(236, 72, 153, 0.3); color: #f472b6; margin-left: 8px;">🌐 Dịch song ngữ</button>
      </div>

      <div class="navigation-controls" style="display: flex; gap: 8px; justify-content: center; align-items: center;">
        <select id="studyMasteryFilter" style="height: 28px; padding: 0 8px; font-size: 12px; border-radius: 6px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.15); color: white; outline: none; cursor: pointer;">
          <option value="all">💎 Tất cả số lần đọc</option>
          <option value="0">🔴 Chưa đọc (0 lần)</option>
          <option value="1">🟡 Đã đọc 1 lần</option>
          <option value="2">🟢 Đã đọc 2 lần</option>
          <option value="3">💎 Đọc từ 3 lần trở lên</option>
        </select>
        <button class="font-btn" id="btnPrevItem" style="background: rgba(139, 92, 246, 0.15); border-color: rgba(139, 92, 246, 0.3); color: #c084fc;">◀ Đề trước</button>
        <span id="navPositionIndicator" style="font-size: 13px; color: var(--muted); min-width: 50px; text-align: center;">-- / --</span>
        <button class="font-btn" id="btnNextItem" style="background: rgba(139, 92, 246, 0.15); border-color: rgba(139, 92, 246, 0.3); color: #c084fc;">Đề tiếp ▶</button>
      </div>

      <div id="studyLinkContainer" style="display: none; min-width: 120px; text-align: right;">
        <button class="font-btn" id="btnStudyLink" style="background: rgba(59, 130, 246, 0.15); border-color: rgba(59, 130, 246, 0.3); color: #60a5fa; display: inline-flex;">🔗 Mở đề thi ➔</button>
      </div>
    </div>

    <div class="tts-controls" style="display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 18px; background: rgba(0, 0, 0, 0.25); padding: 8px 16px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.05); flex-wrap: wrap;">
      <span style="font-size: 13px; font-weight: 600; color: var(--purple2); display: flex; align-items: center; gap: 6px;">🔊 Đọc từ trên xuống:</span>
      
      <button class="font-btn" id="btnTtsPlay" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; border: none; font-size: 12px; height: 28px; padding: 0 12px; font-weight: 600;">▶ Phát</button>
      <button class="font-btn" id="btnTtsPause" style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: white; border: none; font-size: 12px; height: 28px; padding: 0 12px; font-weight: 600; display: none;">⏸ Tạm dừng</button>
      <button class="font-btn" id="btnTtsStop" style="background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); color: white; border: none; font-size: 12px; height: 28px; padding: 0 12px; font-weight: 600; display: none;">⏹ Dừng</button>
      
      <div style="display: flex; align-items: center; gap: 6px; margin-left: 8px;">
        <label for="ttsVoiceSelect" style="font-size: 12px; color: var(--text);">Giọng đọc:</label>
        <select id="ttsVoiceSelect" style="width: auto; height: 28px; padding: 0 8px; font-size: 12px; border-radius: 6px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.15); color: white; outline: none; cursor: pointer;">
          <option value="bilingual" selected>🇬🇧🇻🇳 Song ngữ Anh - Việt</option>
          <option value="en-US">🇬🇧 Tiếng Anh (English)</option>
          <option value="vi-VN">🇻🇳 Tiếng Việt (Vietnamese)</option>
        </select>
      </div>

      <div style="display: flex; align-items: center; gap: 6px; margin-left: 8px;">
        <label for="ttsSpeedSelect" style="font-size: 12px; color: var(--text);">Tốc độ:</label>
        <select id="ttsSpeedSelect" style="width: auto; height: 28px; padding: 0 8px; font-size: 12px; border-radius: 6px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.15); color: white; outline: none; cursor: pointer;">
          <option value="0.8">0.8x</option>
          <option value="1.0" selected>1.0x</option>
          <option value="1.2">1.2x</option>
          <option value="1.5">1.5x</option>
          <option value="2.0">2.0x</option>
          <option value="3.0">3.0x</option>
        </select>
      </div>
    </div>
    
    <div class="study-card">
      <div class="detail-header" style="margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 16px; display: flex; justify-content: space-between; align-items: flex-start;">
        <div class="detail-title-block" style="flex: 1;">
          <span id="detailSkill" class="skill-badge">Kỹ năng</span>
          <h2 id="detailTitle" style="margin-top: 10px; font-size: 22px; font-weight: 700; color: #fff; letter-spacing: 0.5px;">Tiêu đề tài liệu</h2>
          <div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px;">
            <span class="detail-date" id="detailDate" style="font-size: 12px; color: var(--muted);">📅 Ngày lưu: --</span>
            <span class="detail-date" id="detailFolder" style="font-size: 12px; color: var(--muted);">📁 Thư mục: --</span>
          </div>
        </div>
        
        <div class="detail-mastery-actions" style="margin-top: 10px;">
          <span class="mastery-lbl">Số lần đọc:</span>
          <div class="read-count-controls" style="display: flex; gap: 8px; align-items: center; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 20px;">
            <button class="read-count-btn dec-btn" id="btnDecReadCount" style="background: transparent; border: none; color: #ef4444; font-size: 14px; font-weight: bold; cursor: pointer; padding: 0 4px; outline: none; transition: transform 0.1s;">➖</button>
            <span class="read-count-val" id="lblReadCount" style="font-size: 14px; font-weight: 700; color: #fff; min-width: 20px; text-align: center;">0</span>
            <button class="read-count-btn inc-btn" id="btnIncReadCount" style="background: transparent; border: none; color: #10b981; font-size: 14px; font-weight: bold; cursor: pointer; padding: 0 4px; outline: none; transition: transform 0.1s;">➕</button>
          </div>
        </div>
      </div>
      
      <div id="detailContentScroll" style="transition: font-size 0.2s;">
        <!-- Dynamically populated -->
      </div>
    </div>
  </div>

  <div class="scroll-btn-container">
    <button class="scroll-arrow-btn view-img-btn" id="btnFloatingViewImage" title="Xem ảnh nhanh (Phím nóng: I)" style="display: none;">🖼️</button>
    <button class="scroll-arrow-btn" id="btnScrollUp" title="Cuộn lên">▲</button>
    <button class="scroll-arrow-btn" id="btnScrollDown" title="Cuộn xuống">▼</button>
  </div>

  <!-- Modal Xem Ảnh -->
  <div id="imageModal" class="image-modal">
    <span class="image-modal-close" id="btnImageModalClose" title="Đóng modal">&times;</span>
    <div class="image-modal-content-container">
      <div id="imageModalContent"></div>
    </div>
    <a class="image-modal-prev" id="btnImageModalPrev" title="Ảnh trước">&#10094;</a>
    <a class="image-modal-next" id="btnImageModalNext" title="Ảnh sau">&#10095;</a>
  </div>

  <script src="study.js"></script>
</body>
</html>
